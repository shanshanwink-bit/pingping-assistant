server {
    server_name shanshanwink.online www.shanshanwink.online;

    root /var/www/site;
    index index.html;
    server_tokens off;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Pingping formal Node API namespace. Keep the service's internal /api/v1 routes.
    location ~ ^/(pingping-api|api)/v1/ai/(image-recognition|purchase-order-recognition)$ {
        rewrite ^/pingping-api(/.*)$ /api$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        client_max_body_size 4m;
    }

    location /pingping-api/v1/ {
        rewrite ^/pingping-api(/.*)$ /api$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 4m;
    }

    # Pingping formal Go API namespace. Keep the service's internal /admin-api/v1 routes.
    location /pingping-admin-api/v1/ {
        rewrite ^/pingping-admin-api(/.*)$ /admin-api$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 6m;
    }

    # Legacy Pingping API namespaces remain available during migration.
    location /admin-api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 6m;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 4m;
    }

    # Existing independent service; preserved exactly as deployed.
    location /chenxu-api/ {
        proxy_pass http://127.0.0.1:3010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        client_max_body_size 4m;
    }

    location = /pingping {
        return 301 /pingping/;
    }

    location = /pingping/index.html {
        root /var/www;
        expires -1;
    }

    location /pingping/assets/ {
        root /var/www;
        expires 1y;
    }

    location /pingping/ {
        root /var/www;
        try_files $uri $uri/ /pingping/index.html;
    }

    # Xiaofu is reserved only. Never fall through to Pingping services.
    location = /xiaofu {
        return 404;
    }

    location ^~ /xiaofu/ {
        return 404;
    }

    location = /xiaofu-api/v1 {
        default_type application/json;
        return 404 '{"ok":false,"service":"xiaofu","message":"not deployed"}';
    }

    location ^~ /xiaofu-api/v1/ {
        default_type application/json;
        return 404 '{"ok":false,"service":"xiaofu","message":"not deployed"}';
    }

    location = /admin {
        return 301 /admin/;
    }

    location = /admin/index.html {
        root /var/www;
        expires -1;
    }

    location /admin/assets/ {
        root /var/www;
        expires 1y;
    }

    location /admin/ {
        root /var/www;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/shanshanwink.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/shanshanwink.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.shanshanwink.online;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/shanshanwink.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shanshanwink.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.shanshanwink.online;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    if ($host = www.shanshanwink.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = shanshanwink.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name shanshanwink.online www.shanshanwink.online;
    server_tokens off;
    return 404; # managed by Certbot
}
